          zoom: 0.01
          at: rise
        - image: shots/applause.png
          move: in
          zoom: 0.01
          at: clap
      fade: 0
  - id: ovation
    scene: illustration
    say: Роналдиньо получил овацию на стадионе, где обычно поддерживают только
      «Реал».
    voice:
      source: assets/voice/ovation.wav
