post:
  title: Роналдиньо — овация болельщиков «Реала»
  text: >-
    Маленькие большие дела · ФУТБОЛЬНЫЙ ВАУ-ФАКТ! smart_little_toons, София и
    Матвей.


    19 ноября2005, «Реал»—«Барселона»0:3:два гола Роналдиньо и аплодисменты
    болельщиков соперника. Источники:UEFA и FC Barcelona, ссылки в sources.md.


    Оригинальные художественные иллюстрации созданы встроенным image_gen; точный
    ID модели не раскрыт. Это иллюстрированная история с движением камеры и
    последовательными состояниями действий. Голоса синтетические:OmniVoice B,
    Матвей C и София A через Qwen3-TTS.


    Настоящее фото:Darz Mol,7мая2006,празднование чемпионства2005/06,не матч
    ноября2005. https://commons.wikimedia.org/wiki/File:Ronaldinho-7-5-2006.jpg
    ; CC BY-SA3.0 https://creativecommons.org/licenses/by-sa/3.0/ . Фото
    показано целиком без ретуши. Фотография сохраняет собственную
    лицензию;другие материалы имеют отдельные условия.
  tags:
    - Роналдиньо
    - футбол
    - мультфильм
    - футбольныйвауфакт
    - smart_little_toons
scenes:
  - id: hook
    scene: series-cover
    say: ФУТБОЛЬНЫЙ ВАУ-ФАКТ! Роналдиньо заставил болельщиков «Реала» аплодировать
      «Барселоне»!
    voice:
      source: assets/voice/hook.wav
      speed: 1
    pad:
      - 0
      - 0.25
    props:
      image: shots/cover.png
      projectFrom: facts.series.project
      titleFrom: facts.series.title
      subtitleFrom: facts.series.episode
      emblem: /rc/styles/cartoon/golden-ball.svg
      reveal: shots/applause.png
      revealAt: 3.2
  - id: arena
    scene: illustration
    say: "[19 ноября 2005](=девятнадцатого ноября две тысячи пятого) года на
      стадионе «Сантьяго Бернабеу» в Мадриде состоялось одно из самых знаменитых
      противостояний футбола — {#clash}«Реал Мадрид» против «Барселоны»."
    voice:
      source: assets/voice/arena.wav
      speed: 1
    pad:
      - 0.08
      - 0.25
    props:
      shots:
        - image: shots/arena-wide.png
          move: in
          zoom: 0.01
        - image: shots/faceoff.png
          move: in
          zoom: 0.01
          at: clash
      fade: 0
  - id: result
    scene: illustration
    say: «Барселона» победила со счётом [3:0](=три ноль).
    voice:
      source: assets/voice/result.wav
      speed: 1
    pad:
      - 0.08
      - 1.1
    props:
      shots:
        - image: shots/celebrate.png
          move: in
          zoom: 0.01
      fade: 0
  - id: hero
    scene: archive-photo
    say: Но настоящим героем вечера стал Роналдиньо!
    voice:
      source: assets/voice/hero.wav
      speed: 1
    pad:
      - 0.08
      - 1.1
    props:
      image: shots/ronaldinho-2006.jpg
      background: shots/celebrate.png
      titleFrom: facts.archive.title
      captionFrom: facts.archive.date
      portrait: true
      fit: contain
  - id: first
    scene: illustration
    say: "Бразилец забил два невероятных гола: {#beat}сначала обыграл нескольких
      защитников {#shot}и отправил мяч в ворота,"
    voice:
      source: assets/voice/first.wav
      speed: 1
    pad:
      - 0.08
      - 0.25
    props:
      shots:
        - image: shots/first-approach.png
          move: in
          zoom: 0.01
        - image: shots/first-beat.png
          move: in
          zoom: 0.01
          at: beat
        - image: shots/first-shot.png
          move: in
          zoom: 0.01
          at: shot
      fade: 0
  - id: second
    scene: illustration
    say: а затем снова прорвался по левому флангу {#finish}и обманул голкипера Икера
      Касильяса.
    voice:
      source: assets/voice/second.wav
      speed: 1
    pad:
      - 0.08
      - 1.1
    props:
      shots:
        - image: shots/second-run.png
          move: in
          zoom: 0.01
        - image: shots/second-finish.png
          move: in
          zoom: 0.01
          at: finish
      fade: 0
  - id: standing
    scene: illustration
    say: "И вот случилось невероятное: болельщики «Реала» {#rise}начали вставать со
      своих мест {#clap}и аплодировать футболисту главного соперника!"
    voice:
      source: assets/voice/standing.wav
      speed: 1
    pad:
      - 0.08
      - 0.25
    props:
