    say: Подожди! Болельщики «Реала» аплодировали игроку «Барселоны»?!
    voice:
      source: assets/voice/matvey.wav
      speed: 1
    pad:
      - 0.08
      - 0.25
    props:
      shots:
        - image: shots/matvey.png
          move: in
          zoom: 0.01
      fade: 0
