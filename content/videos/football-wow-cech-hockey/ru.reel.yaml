post:
  title: Петр Чех — футбольный вратарь, который стал хоккейным голкипером!
  text: >-
    Маленькие большие дела · ФУТБОЛЬНЫЙ ВАУ-ФАКТ! София и Матвей,
    smart_little_toons.


    Петр Чех: футбольный вратарь и хоккейный голкипер. Источники: Chelsea FC
    (09.10.2019), IIHF (14.10.2019), Haringey Huskies (27.11.2025).


    Фото: Petr Čech Chelsea2013, Warrenfish,10.08.2013; кадрирование Heiko
    Gerber,20.10.2020,CC BY-SA3.0,
    https://commons.wikimedia.org/wiki/File:Petr_%C4%8Cech_Chelsea_2013.jpg ;
    https://creativecommons.org/licenses/by-sa/3.0/ . Фото показано целиком,без
    новой обрезки или ретуши. Это фото2013,не хоккейного дебюта2019.


    Подробные иллюстрации созданы встроенным image_gen (точный ID модели не
    раскрыт); действия — художественная интерпретация. Голоса синтетические:
    рассказчик OmniVoice B, ведущие Qwen3-TTS по выбранным эталонам Матвей C и
    София A.
  tags:
    - ПетрЧех
    - футбол
    - хоккей
    - мультфильм
    - smart_little_toons
scenes:
  - id: hook
    scene: series-cover
    say: ФУТБОЛЬНЫЙ ВАУ-ФАКТ! {#role}Петр Чех — футбольный вратарь, который стал
      хоккейным голкипером!
    pad:
      - 0
      - 0.25
    voice:
      source: assets/voice/hook.wav
      speed: 1
    props:
      image: shots/cover-final.png
      projectFrom: facts.series.project
      titleFrom: facts.series.title
      subtitleFrom: facts.series.episode
      emblem: /rc/styles/cartoon/golden-ball.svg
      reveal: shots/cover-final.png
      revealAt: 3.2
  - id: imagine-football
    scene: illustration
    say: "Представь: ты много лет защищаешь футбольные ворота, {#cup}выигрываешь
      Лигу чемпионов, становишься одним из самых известных вратарей мира…"
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/imagine-football.wav
      speed: 1
    props:
      shots:
        - image: shots/football-save.png
          move: in
          zoom: 0.018
        - image: shots/trophy.png
          move: in
          zoom: 0.018
          at: cup
  - id: imagine-hockey
    scene: illustration
    say: А после завершения футбольной карьеры надеваешь коньки, берёшь клюшку
      {#ice}и выходишь защищать уже хоккейные ворота!
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/imagine-hockey.wav
      speed: 1
    props:
      shots:
        - image: shots/skates.png
          move: in
          zoom: 0.018
        - image: shots/rink-entry.png
          move: in
          zoom: 0.018
          at: ice
  - id: portrait
    scene: archive-photo
    say: Именно так поступил Петр Чех — знаменитый чешский вратарь, который играл за
      «Челси» и «Арсенал».
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/portrait.wav
      speed: 1
    props:
      image: shots/cech-2013.jpg
      background: shots/cover-final.png
      titleFrom: facts.archive.playerTitle
      captionFrom: facts.archive.playerDate
      portrait: true
      fit: contain
  - id: childhood
    scene: illustration
    say: "Но самое интересное: хоккей не был для него совершенно новым увлечением. В
      детстве Петр тоже занимался хоккеем, {#choice}но в [13](=тринадцать) лет
      ему пришлось выбирать между футболом и хоккеем."
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/childhood.wav
      speed: 1
    props:
      shots:
        - image: shots/childhood.png
          move: in
          zoom: 0.018
        - image: shots/choice-young.png
          at: choice
          move: in
          zoom: 0.018
  - id: choice
    scene: illustration
    say: Он выбрал футбол, хотя любовь ко льду никуда не исчезла.
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/choice.wav
      speed: 1
    props:
      shots:
        - image: shots/choice-young.png
          move: in
          zoom: 0.018
  - id: return
    scene: illustration
    say: В [2019](=две тысячи девятнадцатом) году, завершив профессиональную
      футбольную карьеру, Чех наконец вернулся к своей детской мечте.
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/return.wav
      speed: 1
    props:
      shots:
        - image: shots/return-safe.png
          move: in
          zoom: 0.018
  - id: phoenix
    scene: illustration
    say: Он подписал контракт с хоккейной командой [Guildford Phoenix](=Гилфорд
      Феникс) и стал настоящим хоккейным вратарём!
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/phoenix.wav
      speed: 1
    props:
      shots:
        - image: shots/phoenix.png
          move: in
          zoom: 0.018
  - id: debut
    scene: illustration
    say: А знаешь, что ещё удивительнее? {#shot}В своём первом официальном хоккейном
      матче он помог команде победить в серии буллитов, {#save}отразив решающий
      бросок соперника!{#win}
    pad:
      - 0.06
      - 1.4
    voice:
      source: assets/voice/debut.wav
      speed: 1
    props:
      shots:
        - image: shots/shootout.png
          move: in
          zoom: 0.018
        - image: shots/hockey-save-correct.png
          move: in
          zoom: 0.018
          at: save
        - image: shots/hockey-win.png
          move: in
          zoom: 0.018
          at: win
  - id: huskies
    scene: illustration
    say: Позже Петр играл за другие английские хоккейные клубы, а в ноябре
      [2025](=две тысячи двадцать пятого) года присоединился к [Haringey
      Huskies](=Харингей Хаскис).
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/huskies.wav
      speed: 1
    props:
      shots:
        - image: shots/huskies-correct.png
          move: in
          zoom: 0.018
  - id: matvey
    scene: illustration
    say: Подожди! Он сначала ловил мячи руками, а теперь ловит шайбы?!
    pad:
      - 0.06
      - 0.25
    voice:
      source: assets/voice/matvey.wav
      speed: 1
    props:
      shots:
        - image: shots/matvey-safe.png
          move: in
          zoom: 0.018
      labels:
        - textFrom: facts.cast.matvey
          x: 0.27
          y: 0.26
          at: -1
          tone: navy
    caption: "Матвей: «Подожди! Он сначала ловил мячи руками, а теперь ловит шайбы?!»"
  - id: sofia
    scene: illustration
    say: Именно! Петр Чех доказал, что даже после завершения одной спортивной
      карьеры можно осуществить мечту из детства!
    pad:
      - 0.06
      - 1.1
    voice:
      source: assets/voice/sofia.wav
      speed: 1
    props:
      shots:
        - image: shots/sofia-safe.png
          move: in
          zoom: 0.018
      labels:
        - textFrom: facts.cast.sofia
          x: 0.73
          y: 0.46
          at: -1
          tone: navy
    caption: "София: «Именно! Петр Чех доказал, что даже после завершения одной
      спортивной карьеры можно осуществить мечту из детства!»"
