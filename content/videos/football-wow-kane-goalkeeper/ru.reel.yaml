          fit: contain
        - image: shots/asteras-card.svg
          labelFrom: facts.teams.away
          fit: contain
    voice:
      source: assets/voice/kane-v2/venue.wav
      speed: 1
  - id: hat-trick
    scene: illustration
    say: «Тоттенхэм» уверенно вёл со счётом [5:0](=пять ноль), {#three}а Кейн уже оформил
      хет-трик — забил три мяча за матч.
    pad:
      - 0.05
      - 1.15
    props:
      shots:
        - image: shots/celebrate.png
          move: in
          zoom: 0.018
      labels:
