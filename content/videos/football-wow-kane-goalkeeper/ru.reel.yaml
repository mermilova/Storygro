post:
  title: Харри Кейн — нападающий, который стал вратарём!
  text: >-
    Харри Кейн забил три гола, а затем встал в ворота: «Тоттенхэм» — «Астерас», 23 октября
    2014, 5:1. Источник: Tottenham Hotspur, официальный отчёт о матче.


    Маленькие большие дела · ФУТБОЛЬНЫЙ ВАУ-ФАКТ! София и Матвей, smart_little_toons. Голоса
    синтетические: рассказчик — OmniVoice B, Матвей C и София A — Qwen3-TTS; иллюстрации
    созданы встроенным GPT Image, действия — художественная интерпретация.


    Фото: Harry Kane 2023 (cropped) — Simon Walker / No 10 Downing Street, UK Prime
    Minister, 10.10.2023, CC BY 2.0,
    https://commons.wikimedia.org/wiki/File:Harry_Kane_2023_(cropped).jpg ;
    https://creativecommons.org/licenses/by/2.0/. Опубликованное кадрирование Stanley
    Gordon, без дополнительной ретуши или обрезки. Это портрет 2023 года, не фото матча 2014
    года. Гербы Tottenham Hotspur и Asteras Tripolis показаны для обозначения участников
    матча; принадлежат соответствующим клубам. Источники:
    https://en.wikipedia.org/wiki/File:Tottenham_Hotspur.svg ;
    https://commons.wikimedia.org/wiki/File:Asteras_Tripolis_Logo.svg .
  tags:
    - футбол
    - ХарриКейн
    - мультфильм
    - детям
    - smart_little_toons
scenes:
  - id: hook
    scene: series-cover
    say: ФУТБОЛЬНЫЙ ВАУ-ФАКТ! {#role}Харри Кейн — нападающий, который стал вратарём!
    pad:
      - 0
      - 0.3
    props:
      image: shots/cover-fixed.png
      projectFrom: facts.series.project
      titleFrom: facts.series.title
      subtitleFrom: facts.series.episode
      emblem: /rc/styles/cartoon/golden-ball.svg
    voice:
      source: assets/voice/kane-v2/hook.wav
      speed: 1
  - id: imagine
    scene: illustration
    say: "Представь: ты забиваешь три гола за один матч, {#change}а через несколько минут тебе
      приходится защищать собственные ворота!"
    pad:
      - 0.05
      - 0.3
    props:
      shots:
        - image: shots/strike-fixed.png
          move: in
          zoom: 0.018
        - image: shots/keeper.png
          move: in
          zoom: 0.018
          at: change
    voice:
      source: assets/voice/kane-v2/imagine.wav
      speed: 1
  - id: context
    scene: archive-photo
    say: Именно это случилось с Харри Кейном [23](=двадцать третьего) октября [2014](=две тысячи
      четырнадцатого) года
    pad:
      - 0.05
      - 0
    props:
      image: shots/kane-2023.jpg
      background: shots/cover-fixed.png
      titleFrom: facts.archive.playerTitle
      captionFrom: facts.archive.playerDate
      portrait: true
      fit: contain
    voice:
      source: assets/voice/kane-v2/context.wav
      speed: 1
  - id: venue
    scene: photo-pair
    say: в матче Лиги Европы между «Тоттенхэмом» и греческим «Астерасом».
    pad:
      - 0
      - 0.65
    props:
      image: shots/cover-fixed.png
      headingFrom: facts.teams.heading
      portraits:
        - image: shots/tottenham-card.svg
