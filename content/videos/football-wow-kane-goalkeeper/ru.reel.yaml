      speed: 1
  - id: red-card
    scene: illustration
    say: "Но на [87-й](=восемьдесят седьмой) минуте произошло неожиданное: вратарь «Тоттенхэма»
      Уго Льорис получил красную карточку."
    pad:
      - 0.05
      - 0.4
    props:
      shots:
        - image: shots/red-card.png
          move: in
          zoom: 0.018
      labels:
        - textFrom: facts.match.minute
