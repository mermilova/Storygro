post:
  title: Обзор матчей · Ливерпуль — Арсенал · 01.11.2026
  text: >-
    Маленькие большие дела · ОБЗОР МАТЧЕЙ. Новый выпуск smart_little_toons:
    София за «Арсенал», Матвей за «Ливерпуль». Разные команды, одна любовь к
    футболу!


    Ливерпуль — Арсенал, 1 ноября 2026: 0:1, Хаверц, 16-я минута. Гол,
    перекладина Вирца, спорный эпизод без назначенного пенальти, замены, сейв
    Алиссона и нервный финал. Источники: Liverpool FC и Sky Sports, ссылки в
    sources.md.


    Подробные художественные AI-иллюстрации созданы встроенным image_gen, точный
    ID модели инструмент не раскрывает. Смена нарисованных состояний и движение
    камеры; не документальная видеозапись и не полная анимация персонажей.
    Реакции Софии и Матвея — авторские. Озвучка синтетическая: OmniVoice B,
    Qwen3 с точными выбранными голосами София A/Матвей C.


    Настоящее фото Кая Хаверца: Chensiyuan, 24 мая 2026; кадрирование
    NullReason, CC BY-SA 4.0 https://creativecommons.org/licenses/by-sa/4.0/ .
    https://commons.wikimedia.org/wiki/File:1_kai_havertz_2026_(cropped).jpg .
    Использован существующий опубликованный кроп, показан целиком, без ретуши;
    это не фото матча 1 ноября. Фото сохраняет свою лицензию; остальные
    материалы имеют отдельные условия.
  tags:
    - ОбзорМатчей
    - Арсенал
    - Ливерпуль
    - футбол
    - smart_little_toons
