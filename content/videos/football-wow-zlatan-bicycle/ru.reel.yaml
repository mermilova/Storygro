post:
  title: Златан Ибрагимович — гол через себя почти с 30 метров!
  text: |-
    Маленькие большие дела · ФУТБОЛЬНЫЙ ВАУ-ФАКТ! smart_little_toons, София и Матвей.

    14 ноября 2012, Швеция — Англия, Friends Arena: четыре гола Златана и знаменитый удар через себя. Премия Пушкаша2013 присуждена за гол2012; церемония13 января2014. Источники: UEFA, Svensk Fotboll, FIFA, Puskas.com.

    Рисунки созданы встроенным image_gen (точный ID модели не раскрыт); оригинальная художественная интерпретация,не архивное видео. Голоса синтетические: OmniVoice B, выбранные Матвей C и София A через Qwen3-TTS.

    Настоящее фото: Илья Хохлов / Football.ua, июнь2012, CC BY-SA3.0, https://commons.wikimedia.org/wiki/File:Zlatan_Ibrahimovi%C4%87_Euro_2012_vs_England.JPG ; https://creativecommons.org/licenses/by-sa/3.0/ . Фото сохранено без ретуши и показано целиком. Это Евро2012,не ноябрьский гол. Архитектурный референс: Richard Matthews, Friends Arena14.11.2012,CC BY2.0, https://commons.wikimedia.org/wiki/File:Friends_Arena,_Stockholm.jpg . Сам снимок арены в фильм не включён. Отдельные условия сторонних материалов сохраняются.
  tags:
    - Златан
    - футбол
    - мультфильм
    - футбольныйвауфакт
    - smart_little_toons
scenes:
  - id: hook
    scene: series-cover
    say: ФУТБОЛЬНЫЙ ВАУ-ФАКТ! Златан Ибрагимович забил невероятный гол через себя
      почти с [30](=тридцати) метров!
    voice:
      source: assets/voice/hook.wav
      speed: 1
    pad:
      - 0
      - 0.23
    props:
      image: shots/cover-final.png
