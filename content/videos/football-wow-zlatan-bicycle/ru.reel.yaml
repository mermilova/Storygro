  - id: arena
    scene: illustration
    say: "[14 ноября 2012](=четырнадцатого ноября две тысячи двенадцатого) года
      сборная Швеции принимала Англию в товарищеском матче {#venue}на открытии
      нового национального стадиона [Friends Arena](=Френдс Арена) в городе
      Сольна, недалеко от Стокгольма."
    voice:
      source: assets/voice/arena.wav
      speed: 1
    pad:
      - 0.06
      - 0.23
    props:
      shots:
        - image: shots/arrival-safe.png
          move: in
          zoom: 0.012
        - image: shots/arena-wide.png
          move: in
          zoom: 0.012
          at: venue
      fade: 0
  - id: crowd
    scene: illustration
    say: На трибунах собрались почти [50](=пятьдесят) тысяч зрителей.
    voice:
      source: assets/voice/crowd.wav
      speed: 1
    pad:
